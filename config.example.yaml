default:
  # Repositories to clone from remote (using git clone)
  repos:
    # - git@github.com:your-org/your-app.git
    # - git@github.com:your-org/your-api.git

  # Local directories/files to copy (useful for large repos or local-only projects)
  # Use "source -> dest" to control the destination name, or just a path to keep the original name
  local_files:
    # - ~/projects/my-project
    # - "~/projects/my-infrastructure -> infra"

  description: Default workspace template

test:
  # Repositories to clone from remote (using git clone)
  repos: []

  # Local directories/files to copy
  # Use "source -> dest" to control the destination name
  local_files:
    # - ~/projects/my-project

  description: A minimal test workspace

# Agent settings.
#
# resume_commands: what `aw resurrect` types into a restored pane to reopen
# the agent's conversation. When the hooks recorded the conversation id, a
# `{session_id}` placeholder is substituted (shell-quoted) so the *exact*
# conversation reopens; without an id the built-in `--continue`-style
# fallback reopens the directory's latest. Built-in defaults cover
# claude/codex/opencode/kimi (docs/resurrect.md); set an agent to "" to
# restore its pane as a plain shell instead.
# agent_config:
#   resume_commands:
#     claude: "claude --resume {session_id}"
#     codex: ""

